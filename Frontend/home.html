<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>User Dashboard</title>
</head>
<body>
  <main class="home-page">
        <h1>User Dashboard</h1>
        <button type="button" id="logout-btn">Sign Out</button>
        <p>Search user records</p>
        
        <h2>Search Users</h2>

        <form id="name-search">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname">
            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname">
            <button type="submit">Search by Name</button>
        </form>

        <form id="username-search">
            <label for="username">Username:</label>
            <input type="text" id="username" required>
            <button type="submit">Search by Username</button>
        </form>

        <form id="age-search">
            <label for="age-min">Minimum Age:</label>
            <input type="number" id="age-min" min="0">
            <label for="age-max">Maximum Age:</label>
            <input type="number" id="age-max" min="0">
            <button type="submit">Search by Age</button>
        </form>

        <form id="salary-search">
            <label for="salary-min">Minimum Salary:</label>
            <input type="number" id="salary-min" min="0" step="0.01">
            <label for="salary-max">Maximum Salary:</label>
            <input type="number" id="salary-max" min="0" step="0.01">
            <button type="submit">Search by Salary</button>
        </form>

        <form id="registered-after-search">
            <label for="after-username">Registered After Username:</label>
            <input type="text" id="after-username" required>
            <button type="submit">Search Registered After</button>
        </form>

        <form id="never-signed-in-search">
            <button type="submit">Search Users Who Never Signed In</button>
        </form>

        <form id="same-day-search">
            <label for="same-day-username">Registered on Same Day as Username:</label>
            <input type="text" id="same-day-username" required>
            <button type="submit">Search Same Registration Day</button>
        </form>

        <form id="today-search">
            <button type="submit">Search Users Registered Today</button>
        </form>

        <h2>Search Results</h2>
        <p id="message"></p>

        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Salary</th>
                    <th>Age</th>
                    <th>Registered</th>
                    <th>Last Sign-In</th>
                </tr>
            </thead>
            <tbody id="table-body">

            </tbody>
        </table>

</main>
<script src="home.js"></script>
</body>
</html>
